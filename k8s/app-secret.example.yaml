# PLANTILLA de secretos. Este archivo es un ejemplo y no contiene credenciales
# reales (enunciado §11 y §14.2).
#
# Para desplegar, copia este archivo a app-secret.yaml, sustituye los valores y
# aplícalo. app-secret.yaml está en .gitignore precisamente para que nunca se
# suba al repositorio.
#
#   cp k8s/app-secret.example.yaml k8s/app-secret.yaml
#   # edita los valores
#   kubectl apply -f k8s/app-secret.yaml
#
# En un entorno real esto lo entregaría un gestor de secretos (Sealed Secrets,
# External Secrets, Vault) en lugar de un archivo YAML.
apiVersion: v1
kind: Secret
metadata:
  name: licitaciones-secret
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: licitaciones
type: Opaque
stringData:
  # stringData admite texto plano y Kubernetes lo codifica en base64 al
  # guardarlo. Es más legible que data, donde habría que codificarlo a mano.
  POSTGRES_USER: "CAMBIAR_USUARIO"
  POSTGRES_PASSWORD: "CAMBIAR_CONTRASENA"
